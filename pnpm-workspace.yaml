packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/*"
  - "services/*"

# pnpm 11 dependency scripts are deny-by-default. Keep this review explicit
# and committed so installs do not stop on ERR_PNPM_IGNORED_BUILDS.
strictDepBuilds: true

allowBuilds:
  # Required by tsx/Next/Expo tooling.
  esbuild: true

  # Optional native acceleration paths. The JavaScript fallbacks are sufficient
  # for this monorepo, so do not execute their install/build scripts.
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false

# pnpm 11 otherwise may automatically run a full workspace install before
# every `pnpm run` when dependency state differs. Warn instead of reinstalling.
verifyDepsBeforeRun: warn

engineStrict: true

# Supply-chain freshness gate. Newly published packages must age for 24h
# unless a version is explicitly reviewed below.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.18"
  - "@expo/config-plugins@57.0.9"
  - "@expo/config@57.0.9"
  - "@expo/fingerprint@0.20.10"
  - "@expo/image-utils@0.11.5"
  - "@expo/metro-config@57.0.10"
  - "@expo/metro-file-map@57.0.2"
  - "@expo/prebuild-config@57.0.14"
  - "@expo/require-utils@57.0.5"
  - "@react-native/assets-registry@0.86.3"
  - "@react-native/codegen@0.86.3"
  - "@react-native/community-cli-plugin@0.86.3"
  - "@react-native/debugger-frontend@0.86.3"
  - "@react-native/debugger-shell@0.86.3"
  - "@react-native/dev-middleware@0.86.3"
  - "@react-native/gradle-plugin@0.86.3"
  - "@react-native/js-polyfills@0.86.3"
  - "@react-native/normalize-colors@0.86.3"
  - "@react-native/virtualized-lists@0.86.3"
  - "babel-preset-expo@57.0.8"
  - "expo-asset@57.0.14"
  - "expo-constants@57.0.14"
  - "expo-modules-autolinking@57.0.11"
  - "expo-modules-core@57.0.13"
  - "expo@57.0.16"
  - "react-native@0.86.3"
