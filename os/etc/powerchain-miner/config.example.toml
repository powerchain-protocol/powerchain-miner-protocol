[device]
id = "solar-roof-001"
label = "Workshop Solar"
renewable_type = "solar"
model = "Raspberry Pi 5"
data_dir = "/var/lib/powerchain-miner"
identity_path = "/var/lib/powerchain-miner/device-ed25519.pem"

[server]
control_plane_url = "https://api.miner.example.com"
# Client-scoped enrollment credential generated by:
# POST /api/v1/clients/:clientId/device-keys
# Remove it from this file after successful enrollment if re-enrollment is not required.
device_api_key = "pcmk_replace-with-client-device-api-key"

[proof]
quality_bps = 10000

[sampling]
sample_interval_seconds = 5
# Missing telemetry longer than this is never extrapolated into energy.
max_sample_gap_seconds = 15
proof_interval_seconds = 60
heartbeat_interval_seconds = 30

# Development only:
[source]
kind = "mock"
nominal_power_w = 4500

# HTTP JSON meter example:
# [source]
# kind = "http_json"
# url = "http://192.168.1.50/status"
# power_field = "meter.active_power_w"

# Generic Modbus TCP meter example.
# Register addresses/scales MUST come from the meter/inverter vendor map.
# [source]
# kind = "modbus_tcp"
# host = "192.168.1.60"
# port = 502
# device_id = 1
# power_register = 40083
# power_register_count = 1
# power_scale = 1.0
