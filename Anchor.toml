[toolchain]
anchor_version = "1.1.2"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
miner = "11111111111111111111111111111111"
cct = "11111111111111111111111111111111"

[programs.mainnet]
miner = "11111111111111111111111111111111"
cct = "11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "corepack pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
