services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: powerchain_miner
      POSTGRES_USER: powerchain
      POSTGRES_PASSWORD: powerchain
    ports:
      - "5432:5432"
    volumes:
      - miner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerchain -d powerchain_miner"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  miner_postgres:
