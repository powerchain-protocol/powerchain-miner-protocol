[project]
name = "powerchain-renewable-miner"
version = "1.3.1"
description = "Raspberry Pi renewable-energy proof agent for PowerChain Miner OS"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "pymodbus>=3.9,<4"
]

[project.scripts]
powerchain-miner = "powerchain_miner.agent:main"
powerchain-miner-update = "powerchain_miner.update:main"
powerchain-miner-inspect = "powerchain_miner.inspect:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
