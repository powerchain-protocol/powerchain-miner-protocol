openapi: 3.1.0
info:
  title: PowerChain Renewable Miner API
  version: 1.0.0
  description: Multi-tenant control plane for renewable Proof-of-Energy nodes and MINER rewards.
servers:
  - url: http://localhost:3100
paths:
  /api/v1/health:
    get:
      summary: Service health
      responses: {"200": {description: Healthy}}
  /api/v1/health/live:
    get:
      summary: Liveness probe
      responses: {"200": {description: Alive}}
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      responses:
        "200": {description: Ready}
        "503": {description: Not ready}
  /api/v1/health/chain:
    get:
      summary: Cached on-chain deployment health
      description: Verifies program deployment, v1 ProtocolConfig, Token-2022 treasury PDA/mint/authority, and RPC freshness.
      responses:
        "200": {description: Chain deployment healthy}
        "503": {description: Chain deployment mismatch or unavailable}
  /api/v1/auth/login:
    post:
      summary: Authenticate console user
      responses:
        "200": {description: Authenticated}
        "401": {description: Invalid credentials}
  /api/v1/clients:
    get:
      summary: List accessible clients
      security: [{bearerAuth: []}]
      responses: {"200": {description: Clients}}
  /api/v1/devices/register:
    post:
      summary: Enroll a renewable node
      security: [{deviceApiKey: []}]
      responses: {"201": {description: Device enrolled}}
  /api/v1/proofs:
    get:
      summary: List proofs in an authenticated client scope
      security: [{bearerAuth: []}]
      responses: {"200": {description: Proofs}}
    post:
      summary: Submit signed Proof of Energy for evidence review
      responses:
        "200": {description: Idempotent replay of an already stored proof}
        "202": {description: Proof received and pending attestation}
        "409": {description: Sequence, digest continuity, or source identity conflict}
        "425": {description: Reward/epoch/verification policy is not ready}
        "422": {description: Proof violates physical or timestamp limits}

  /api/v1/evidence-verifiers:
    get:
      summary: List registered evidence-verifier identities
      security: [{bearerAuth: []}]
      responses: {"200": {description: Verifiers}}
    post:
      summary: Register an Ed25519 evidence-verifier public identity
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Verifier registered}
        "422": {description: Invalid verifier public key}
  /api/v1/verification-policies:
    get:
      summary: List evidence verification policies and assigned service verifiers
      security: [{bearerAuth: []}]
      responses: {"200": {description: Verification policies}}
    post:
      summary: Create verifier-bound evidence verification policy
      security: [{bearerAuth: []}]
      responses: {"201": {description: Verification policy created}}
  /api/v1/clients/{clientId}/devices/{deviceId}/chain-binding/expected:
    get:
      summary: Derive expected DeviceAccount and MinerAccount PDAs
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Deterministic PDA mapping}
        "409": {description: Device owner or reward wallet missing}
  /api/v1/clients/{clientId}/devices/{deviceId}/chain-binding/verify:
    post:
      summary: Verify expected PDAs exist and are owned by the Miner program
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Chain binding verified}
        "409": {description: Expected accounts are missing or invalid}
  /api/v1/rewards/summary:
    get:
      summary: Reward summary including the authenticated member's own available balance
      security: [{bearerAuth: []}]
      responses: {"200": {description: Reward summary}}
  /api/v1/reward-claims:
    get:
      summary: List visible reward claims
      security: [{bearerAuth: []}]
      responses: {"200": {description: Claims}}
    post:
      summary: Request a reward claim
      description: Supports optional Idempotency-Key. Claim destination must equal the member's configured Solana reward wallet.
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Claim requested}
        "409": {description: Insufficient balance, wallet mismatch, or idempotency conflict}
  /api/v1/clients/{clientId}/reward-claim-approval-policy:
    get:
      summary: Read the client reward-claim approval policy
      security: [{bearerAuth: []}]
      responses: {"200": {description: Approval policy or canonical default}}
    put:
      summary: Replace the active claim approval policy
      description: Snapshots role-distinct approval requirements onto newly requested claims.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Approval policy updated}
        "403": {description: Client Admin role required}
  /api/v1/reward-claims/{claimId}/approve:
    post:
      summary: Add one role-distinct claim approval
      description: Requesters cannot self-approve. High-value policies can require both FINANCE and CLIENT_ADMIN approvals. SuperAdmin is not a substitute for a client-scoped approver.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Approval recorded; claim may remain REQUESTED until quorum}
        "403": {description: Required client-scoped approver role missing}
        "409": {description: Self approval, duplicate role, or invalid state}
  /api/v1/reward-claims/{claimId}/prepare:
    post:
      summary: Prepare the wallet-authorized Anchor claim instruction
      description: Derives canonical program accounts and returns a short-lived owner-signed claim_rewards instruction.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Claim instruction prepared}
        "409": {description: Claim, wallet, MinerAccount, treasury vault, or ClaimReceipt is not ready}
  /api/v1/reward-claims/{claimId}/settled:
    post:
      summary: Reconcile a wallet-authorized Miner-program claim
      description: Verifies the Miner program invocation, ClaimReceipt PDA, Token-2022 transfer from the program treasury vault, destination account and exact claim amount.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Canonical on-chain claim verified and reconciled}
        "409": {description: Program, receipt, treasury vault, destination, amount, or claim state mismatch}
  /api/v1/clients/{clientId}/source-rotations:
    get:
      summary: List meter/EMS source-identity rotations
      security: [{bearerAuth: []}]
      responses: {"200": {description: Source rotations}}
  /api/v1/clients/{clientId}/devices/{deviceId}/source-rotations:
    post:
      summary: Request a meter/EMS source-identity rotation
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Rotation requested}
        "409": {description: Source identity not established or another rotation is pending}
  /api/v1/audit:
    get:
      summary: Read paginated audit events
      security: [{bearerAuth: []}]
      responses: {"200": {description: Audit events with hash-chain fields}}
  /api/v1/audit/verify:
    get:
      summary: Verify the tamper-evident audit chain for platform or client scope
      security: [{bearerAuth: []}]
      responses: {"200": {description: Chain verification result}}
  /api/v1/audit/checkpoints:
    get:
      summary: List exportable audit-chain checkpoints
      security: [{bearerAuth: []}]
      responses: {"200": {description: Audit checkpoints}}
    post:
      summary: Create a checkpoint over the current audit chain head
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Checkpoint created}
        "409": {description: Audit scope has no chained event}
  /api/v1/releases/latest:
    get:
      summary: Latest signed node software release
      responses: {"200": {description: Release manifest}}
  /metrics:
    get:
      summary: Prometheus metrics
      responses: {"200": {description: Metrics}}

  /api/v1/agents:
    get:
      summary: List AgentOS agents for a client
      security: [{bearerAuth: []}]
      responses: {"200": {description: Agents}}
    post:
      summary: Create an AgentOS agent and compute account
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Agent created}
        "409": {description: Agent owner is not an active member}
  /api/v1/agents/{agentId}/compute:
    get:
      summary: Read Agent Compute account, keys, balance, usage and top-ups
      security: [{bearerAuth: []}]
      responses: {"200": {description: Agent Compute account}}
    patch:
      summary: Update Agent Compute auto-top-up policy
      security: [{bearerAuth: []}]
      responses: {"200": {description: Compute policy updated}}
  /api/v1/agents/{agentId}/compute/api-keys:
    post:
      summary: Generate a one-time Agent Compute API key
      security: [{bearerAuth: []}]
      responses: {"201": {description: API key generated}}
  /api/v1/agents/{agentId}/compute/topups:
    post:
      summary: Create a wallet funding intent for compute credit
      security: [{bearerAuth: []}]
      responses: {"201": {description: Top-up intent created}}
  /api/v1/compute/models:
    get:
      summary: List configured public compute models
      security: [{bearerAuth: []}]
      responses: {"200": {description: Compute models}}
  /api/v1/core/capabilities:
    get:
      summary: Read canonical Miner protocol capabilities
      responses:
        "200": {description: Canonical v1.0.0 protocol capability map}
  /api/v1/core/characters:
    get:
      summary: Read canonical AgentOS character boundaries
      responses:
        "200": {description: Canonical bounded agent characters}

  /api/v1/internal/proofs/lease:
    post:
      summary: Lease verified proofs to one settlement worker
      description: Trusted worker route using PostgreSQL FOR UPDATE SKIP LOCKED to prevent concurrent Solana settlement.
      responses:
        "200": {description: Leased proof batch}
  /api/v1/internal/proofs/{proofId}/settlement-intent:
    post:
      summary: Persist the signed Solana settlement intent before broadcast
      responses:
        "200": {description: Durable settlement intent prepared}
        "409": {description: Lease lost or conflicting submitted transaction}
  /api/v1/internal/proofs/{proofId}/reconcile:
    post:
      summary: Reconcile a leased proof settlement
      responses:
        "200": {description: Settlement state reconciled}
        "409": {description: Lease lost}


  /api/v1/integrations/helium/programs:
    get:
      summary: Read canonical Helium Solana program and token mint registry
      responses:
        "200": {description: Helium program and mint registry}
  /api/v1/integrations/helium/gateways:
    get:
      summary: List configured Helium multi-gateway gateways
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Gateway status list}
        "503": {description: Helium multi-gateway integration not configured}
  /api/v1/integrations/helium/gateways/{mac}:
    get:
      summary: Read one Helium gateway status
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: mac
          required: true
          schema: {type: string}
      responses:
        "200": {description: Gateway status}
        "503": {description: Helium multi-gateway integration not configured}
  /api/v1/integrations/helium/gateways/{mac}/packets:
    get:
      summary: Read recent Helium gateway packet metadata
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: mac
          required: true
          schema: {type: string}
      responses:
        "200": {description: Recent gateway packet metadata}
        "503": {description: Helium multi-gateway integration not configured}
  /api/v1/integrations/helium/entity/wallet/{wallet}:
    get:
      summary: Read Helium Entity API wallet information
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: wallet
          required: true
          schema: {type: string}
      responses:
        "200": {description: Helium wallet/entity information}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceApiKey:
      type: http
      scheme: bearer
